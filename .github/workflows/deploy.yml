name: Test and deploy

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to GitHub Pages (gh-pages branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          exclude_assets: 'yosys/VERSION'
          # Keep the branch previews under preview/.
          keep_files: true
      - name: Preview folder name
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        id: preview
        run: echo "dir=preview/$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - name: Deploy branch preview (gh-pages/preview/<branch>)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ steps.preview.outputs.dir }}
          exclude_assets: 'yosys/VERSION'
          keep_files: true

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
